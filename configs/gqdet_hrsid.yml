task: detection
model: DFINE
criterion: BRGQACriterion
postprocessor: DFINEPostProcessor
num_classes: 1
remap_mscoco_category: false
remap_custom_category: false
category_ids:
- 1
use_focal_loss: true
eval_spatial_size:
- 640
- 640
output_dir: output/hrsid
print_freq: 100
checkpoint_freq: 9999
sync_bn: true
find_unused_parameters: false
clip_max_norm: 0.7
use_amp: true
scaler:
  type: GradScaler
  enabled: true
  init_scale: 1.0
  growth_interval: 100000
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
use_wandb: false
project_name: GQDet
exp_name: gqdet_hrsid
epochs: 120
DFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  use_p2dia_lite: false
  p2dia_c2: 64
  p2dia_c3: 256
  p2dia_hidden: 64
  p2dia_init_lambda: 0.04
  use_p2dia_main: false
  use_p2dia_gpdm: true
  p2dia_c4: 512
  p2dia_gate_hidden: 32
  p2dia_beta_max: 0.25
  p2dia_gate_max: 0.6
  p2dia_alpha_base_max: 0.27
  p2dia_alpha_res_ratio: 0.5
HGNetv2:
  name: B0
  pretrained: false
  local_model_dir: weight/hgnetv2/
  return_idx:
  - 0
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
HybridEncoder:
  in_channels:
  - 256
  - 512
  - 1024
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  depth_mult: 0.34
  act: silu
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu
  reg_max: 32
  reg_scale: 4.0
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  learn_query_content: false
  aux_loss: true
DFINEPostProcessor:
  num_top_queries: 300
optimizer:
  type: AdamW
  lr: 0.000282143965893
  betas:
  - 0.9
  - 0.999
  weight_decay: 9.45064901788e-05
  protocol_r_groups: true
  protocol_r_main_lr: 0.000282143965893
  protocol_r_backbone_lr: 0.000171782705238
  protocol_r_scalar_lr: 6.43033224178e-05
  protocol_r_main_weight_decay: 9.45064901788e-05
lr_scheduler:
  type: GlobalEpochHoldCosineFloor
  backbone_min_lr: 1.0e-05
  main_min_lr: 5.0e-05
  scalar_min_lr: 5.0e-06
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 667
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: datasets/hrsid/images/train
    ann_file: datasets/hrsid/annotations/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: RandomZoomOut
        fill: 0
        side_range:
        - 1.0
        - 1.3
        p: 0.2
      - type: RandomIoUCrop
        p: 0.35
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
        p: 0.5
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: RandomGrayGamma
        gamma_range:
        - 0.9
        - 1.1
        p: 0.2
        late_p: 0.2
        late_start_epoch: 121
        stop_epoch: 121
      - type: RandomGrayGain
        gain_range:
        - 0.9
        - 1.1
        p: 0.2
        late_p: 0.2
        late_start_epoch: 121
        stop_epoch: 121
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: trainfix
        epoch: 100
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
        start_epoch: 4
        stop_epoch: 121
        gray_start_epoch: 4
        gray_stop_epoch: 110
        spatial_start_epoch: 4
        spatial_stop_epoch: 105
        gray_ops:
        - RandomGrayGamma
        - RandomGrayGain
        spatial_ops:
        - RandomZoomOut
        - RandomIoUCrop
  shuffle: true
  total_batch_size: 12
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 0
    ema_restart_decay: 0.9999
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: datasets/hrsid/images/val
    ann_file: datasets/hrsid/annotations/instances_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  total_batch_size: 32
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
reload_best_at_stop_epoch: false
best_ap5095_only: true
best_checkpoint_name: best_val_ap5095_ema.pth
save_last_all_stages: true
checkpoint_epochs: []
final_ema_restart: true
final_ema_start_epoch: 70
final_ema_decay: 0.9995
final_ema_warmups: 0
BRGQACriterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_brgqa_cls: 1
    loss_brgqa_bbox: 5
    loss_brgqa_giou: 2
  losses:
  - mal
  - boxes
  - local
  gamma: 1.5
  num_classes: 1
  reg_max: 32
  boxes_weight_format: null
  share_matched_indices: false
  brgqa_enabled: true
  brgqa_aux_index: 1
  brgqa_candidate_pool: 4
  brgqa_max_positive: 2
  brgqa_refine_rho: 0.25
  brgqa_conf_gamma: 0.4
  brgqa_rank_tau: 1.5
  brgqa_quality_power: 1.0
  brgqa_mass_normalize: true
  brgqa_small_scale_px: 32
  brgqa_small_iou_thr: 0.25
  brgqa_large_iou_thr: 0.35
  brgqa_allow_empty: true
  brgqa_exclude_o2o: true
  brgqa_exclude_indices_go: true
  brgqa_lambda_max: 0.4
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0
    use_focal_loss: true
tuning: checkpoints/dfine_s_coco.pth
best_raw_checkpoint_name: best_val_ap5095_raw.pth
trainfix_global_epoch_lr: true
validate_raw_from_epoch: 999
validate_raw_every: 999
seed: 20260917
resume: null
enable_trainfix_lgrm: true
final_ema_retain_history: true
